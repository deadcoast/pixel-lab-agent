[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixl-agent"
version = "1.0.0"
description = "PIXL agent project language, pixel-art evidence tools and harness kit"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10",
    "jsonschema>=4.18",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    "setuptools>=84.0.0",
    "sourcery>=1.45.0",
    "tiktoken>=0.14.0",
    "types-jsonschema>=4.25.0",
    "types-setuptools>=84.0.0.20260812",
]

[project.optional-dependencies]
benchmark = ["tiktoken>=0.7"]

[project.scripts]
pixl = "pixl.cli:main"

[tool.setuptools]
packages = ["pixl"]

[tool.setuptools.package-data]
pixl = ["registry.json"]
