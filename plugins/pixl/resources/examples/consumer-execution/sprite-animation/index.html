<!doctype html><html lang="en"><meta charset="utf-8"><title>Sprite motion study</title>
<style>body{margin:28px;background:#101820;color:#e8eff5;font:15px system-ui}h1{font-size:25px;margin:0 0 6px}p{color:#aabcc9;margin:0 0 20px}nav{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#203341;color:inherit;border:1px solid #436070;border-radius:5px}label{display:flex;align-items:center;gap:6px}canvas{display:block;image-rendering:pixelated}#stage{display:inline-block;position:relative;border:1px solid #436070}#anchor{position:absolute;pointer-events:none;width:11px;height:11px;transform:translate(-5px,-5px)}#anchor:before,#anchor:after{content:"";position:absolute;background:#ffcf70}#anchor:before{width:11px;height:1px;top:5px}#anchor:after{width:1px;height:11px;left:5px}#caption{margin-top:12px;min-height:24px}#error{color:#ff9c91;white-space:pre-wrap}</style>
<h1>Sprite motion study</h1><p>Watch the cycle at native size. Step through each pose to compare placement.</p>
<nav><label>Clip <select id="clip"></select></label><label>Scale <select id="scale"></select></label><button id="play">Play</button><button id="previous">Previous frame</button><button id="next">Next frame</button><label><input id="show-anchor" type="checkbox"> Show anchor</label></nav>
<div id="stage"><canvas id="canvas"></canvas><span id="anchor" hidden></span></div><div id="caption"></div><div id="error"></div><script type="module" src="/view.mjs"></script></html>
